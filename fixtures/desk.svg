<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!--
    A synthetic stand-in for a photograph, used by the examples and the E2E suite.

    Because the corner coordinates here are exact and known, the Playwright tests
    can assert projected positions to the pixel rather than eyeballing a
    screenshot. The two screens are deliberately at different angles.

      laptop-screen  (420,310) (980,255) (1050,640) (380,590)
      phone-screen   (1180,560) (1330,585) (1290,835) (1130,800)
  -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2118"/>
      <stop offset="55%" stop-color="#4a3625"/>
      <stop offset="100%" stop-color="#6b4d33"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171a21"/>
      <stop offset="100%" stop-color="#252b36"/>
    </linearGradient>
    <linearGradient id="lidBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aa3ad"/>
      <stop offset="100%" stop-color="#5d666f"/>
    </linearGradient>
    <linearGradient id="baseTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d959e"/>
      <stop offset="100%" stop-color="#b6bcc3"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11151b"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.32" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect y="430" width="1600" height="570" fill="url(#desk)"/>
  <rect width="1600" height="1000" fill="url(#lamp)"/>

  <!-- Laptop: lid shell sits slightly proud of the screen quad -->
  <polygon points="404,296 994,239 1066,650 364,602" fill="url(#lidBack)"/>
  <polygon points="420,310 980,255 1050,640 380,590" fill="url(#screenGlass)"/>

  <!-- Laptop base, foreshortened toward the viewer -->
  <polygon points="380,590 1050,640 1210,806 286,744" fill="url(#baseTop)"/>
  <polygon points="430,624 1010,668 1120,760 372,708" fill="#6f7780" opacity="0.75"/>
  <ellipse cx="742" cy="731" rx="120" ry="16" fill="#5b636c" opacity="0.6"/>

  <!-- Phone, tilted the other way -->
  <polygon points="1166,548 1344,578 1302,850 1116,812" fill="#2c3037"/>
  <polygon points="1180,560 1330,585 1290,835 1130,800" fill="url(#screenGlass)"/>

  <!-- Contact shadows -->
  <ellipse cx="750" cy="800" rx="430" ry="42" fill="#000" opacity="0.35"/>
  <ellipse cx="1215" cy="860" rx="110" ry="22" fill="#000" opacity="0.3"/>

  <text x="40" y="960" font-family="ui-monospace, monospace" font-size="19" fill="#ffffff" opacity="0.32">
    synthetic scene — fixtures/desk.svg
  </text>
</svg>
